name: Crowdin

on:
  push:
    branches: [main]
    paths:
      - 'Whisky/Localizable.xcstrings'
      - 'crowdin.yml'
      - '.github/workflows/Crowdin.yml'
  schedule:
    # Mondays at 06:00 UTC — pull any new translations into a PR
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  synchronize:
    name: Sync with Crowdin
    runs-on: ubuntu-latest
    steps:
      # Stays dormant until the maintainer adds the Crowdin secrets, so the
      # workflow can live in the repo without failing on every push.
      - name: Check Crowdin credentials
        id: check
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        run: |
          if [ -n "$CROWDIN_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CROWDIN_PROJECT_ID secret is not set — skipping sync. See CONTRIBUTING.md for setup."
          fi

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v6

      # Push to main → push new English source strings up to Crowdin.
      - name: Upload sources
        if: steps.check.outputs.configured == 'true' && github.event_name == 'push'
        uses: crowdin/github-action@52aa776766211d83d975df51f3b9c53c2f8ba35f # v2.16.3
        with:
          upload_sources: true
          download_translations: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # Translations that land in the repo (restored strings, translations
      # merged with a feature) never reach Crowdin through the source upload,
      # and the next export then deletes them. Push them up explicitly. The
      # multilingual catalog imports one language per CLI call, so loop over
      # every Crowdin language id.
      - name: Upload translations
        if: steps.check.outputs.configured == 'true' && github.event_name == 'push'
        run: |
          for lang in ar cs da de es-ES fi fr it ja ko nl pl pt-BR pt-PT ro ru sv-SE tr uk vi zh-CN zh-TW; do
            npx -y @crowdin/cli@4 upload translations -l "$lang" --no-progress
          done
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # Schedule / manual → refresh sources, pull translations, open a PR.
      - name: Download translations
        if: steps.check.outputs.configured == 'true' && github.event_name != 'push'
        uses: crowdin/github-action@52aa776766211d83d975df51f3b9c53c2f8ba35f # v2.16.3
        with:
          upload_sources: true
          download_translations: true
          # Untranslated strings must be omitted from the export — otherwise
          # every language gets English source-copies for all 700+ keys and
          # Xcode loses its untranslated-fallback signal. The action passes
          # this to the CLI explicitly, which overrides the project-level
          # skipUntranslatedStrings setting, so it has to be set here.
          skip_untranslated_strings: true
          # Leave the export uncommitted in the workspace: the guard steps
          # below decide whether a PR opens at all. The export REPLACES the
          # catalog wholesale, so keys with no translations anywhere and the
          # locally generated en-GB rows vanish from it (see PR #232 for the
          # failure this prevents).
          push_translations: false
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # The crowdin action runs in a container as root, so the exported file
      # comes back root-owned and later steps cannot rewrite it.
      - name: Fix export file ownership
        if: steps.check.outputs.configured == 'true' && github.event_name != 'push'
        run: sudo chown "$(id -u):$(id -g)" Whisky/Localizable.xcstrings

      - name: Refuse exports that delete keys
        if: steps.check.outputs.configured == 'true' && github.event_name != 'push'
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys
          new = json.load(open("Whisky/Localizable.xcstrings"))["strings"]
          old = json.loads(subprocess.run(
              ["git", "show", "HEAD:Whisky/Localizable.xcstrings"],
              capture_output=True, text=True, check=True).stdout)["strings"]
          missing = sorted(k for k in old if k not in new)
          if missing:
              print("Export dropped %d keys that exist on main; refusing to open a PR." % len(missing))
              print("These keys likely have no translations yet, so the export omits them.")
              for key in missing[:20]:
                  print(" -", key)
              sys.exit(1)
          # en-GB is generated locally by scripts/british-english.py and is
          # restored by the next step, so its absence from the export is fine.
          # A row whose translation is identical to the English source is also
          # fine to lose: Crowdin drops those on import by design, and a
          # missing row falls back to the identical source text at build.
          def value(entry, lang):
              return entry.get("localizations", {}).get(lang, {}).get("stringUnit", {}).get("value")
          lost_rows = {}
          for key, entry in old.items():
              lost = set(entry.get("localizations", {})) \
                  - set(new[key].get("localizations", {})) - {"en-GB"}
              lost = {lang for lang in lost if value(entry, lang) != value(entry, "en")}
              if lost:
                  lost_rows[key] = sorted(lost)
          if lost_rows:
              print("Export dropped language rows for %d keys; refusing to open a PR." % len(lost_rows))
              print("These translations exist in the repo but not on Crowdin;")
              print("the push-triggered translation upload should send them up first.")
              for key in sorted(lost_rows)[:10]:
                  print(" -", key, lost_rows[key][:5])
              sys.exit(1)
          EOF

      # Crowdin still stores some cells whose value is the key itself
      # (audio.findings.fix = "audio.findings.fix" in six languages). They
      # would put raw identifiers on screen, so drop them from every export.
      - name: Strip placeholder translations
        if: steps.check.outputs.configured == 'true' && github.event_name != 'push'
        run: |
          ./scripts/check-placeholder-translations.py --strip
          ./scripts/check-placeholder-translations.py

      - name: Restore en-GB rows
        if: steps.check.outputs.configured == 'true' && github.event_name != 'push'
        run: |
          ./scripts/british-english.py
          ./scripts/british-english.py --check

      - name: Open or update the sync PR
        if: steps.check.outputs.configured == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- Whisky/Localizable.xcstrings; then
            echo "No translation changes; nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B l10n/crowdin
          git add Whisky/Localizable.xcstrings
          git commit -m "l10n: new translations from Crowdin"
          git push --force origin l10n/crowdin
          if [ -z "$(gh pr list --head l10n/crowdin --state open --json number -q '.[0].number')" ]; then
            gh pr create --base main --head l10n/crowdin \
              --title 'New translations from Crowdin' \
              --body 'Automated translation sync. Crowdin is the source of truth for translations; do not hand-edit non-English strings here. This export passed the key-deletion guard and had its en-GB rows regenerated.'
          fi
