name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so trufflehog can compare base..head on PRs and
          # HEAD~1..HEAD on direct pushes. Interpolated values below are
          # all commit SHAs (40-char hex, not user-controllable strings).
          fetch-depth: 0

      - name: Run TruffleHog (PR diff)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
          # The action runs the CLI from a Docker image tagged "latest" by
          # default; keep this in step with the action pin above.
          version: 3.99.7

      - name: Run TruffleHog (push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified
          # The action runs the CLI from a Docker image tagged "latest" by
          # default; keep this in step with the action pin above.
          version: 3.99.7
