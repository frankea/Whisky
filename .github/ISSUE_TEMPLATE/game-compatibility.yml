name: 🎮 Game Compatibility Report
description: A specific game won't run, crashes, or runs poorly.
labels: ["game-compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for **game-specific** issues — a particular game crashing, freezing, rendering wrong, or not launching.
        For non-game bugs (Whisky UI, bottle creation, etc.), use the **Bug Report** template instead.

        **Before filing:**
        - Open the **Game Configurations** browser inside Whisky — your game may already have a recommended config.
        - Search [existing issues](https://github.com/frankea/Whisky/issues?q=is%3Aissue+label%3Agame-compatibility).
  - type: input
    id: game-name
    attributes:
      label: Game name
      placeholder: "e.g., Baldur's Gate 3"
    validations:
      required: true
  - type: input
    id: game-store
    attributes:
      label: Store / launcher
      description: Where you bought / launch the game from.
      placeholder: "e.g., Steam, Epic, GOG, EA App, standalone installer"
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: Compatibility rating you'd give it
      description: Close to the ratings shown in Game Configurations (Works, Playable, Broken, Not Supported); "Doesn't launch" is an extra option for reports.
      options:
        - "Works — runs perfectly with no issues"
        - "Playable — runs with minor issues or required tweaks"
        - "Broken — crashes, freezes, or unplayable"
        - "Doesn't launch — installer or launcher fails before game loads"
        - "Not Supported: blocked by anti-cheat or a kernel driver"
    validations:
      required: true
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Crash on launch? Black screen? Bad performance? Audio cuts out? Be specific.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps you took
      description: Including any tweaks (DXVK, registry edits, winetricks verbs, env vars) you applied before hitting the issue.
    validations:
      required: true
  - type: dropdown
    id: graphics-backend
    attributes:
      label: Graphics backend tried
      description: If you use DXVK, say in the steps above whether DXVK Async is on.
      options:
        - "Recommended (auto)"
        - "D3DMetal"
        - "DXMT"
        - "DXVK"
        - "WineD3D"
        - "Don't know"
    validations:
      required: true
  - type: input
    id: gamedb-id
    attributes:
      label: GameDB entry id (if you applied one)
      description: Shown in **Bottle Configuration → Applied Game Configuration** after you apply one, e.g. `baldurs-gate-3`. Leave blank if no recommended config exists yet.
      placeholder: "e.g., baldurs-gate-3 — or leave blank"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Wine log (relevant excerpt)
      description: |
        Press **⌘L** (File → Open Logs Folder) to open Whisky's logs folder in Finder, open the newest log, and paste the parts around the crash / error.
      render: bash
    validations:
      required: false
  - type: input
    id: whisky-version
    attributes:
      label: Whisky version
      placeholder: "e.g., 3.10.2"
    validations:
      required: true
  - type: dropdown
    id: mac-version
    attributes:
      label: macOS version
      options:
        - "Sequoia (macOS 15.0)"
        - "Sequoia (macOS 15.1)"
        - "Sequoia (macOS 15.2)"
        - "Sequoia (macOS 15.3)"
        - "Sequoia (macOS 15.4)"
        - "Sequoia (macOS 15.5+)"
        - "Tahoe (macOS 26)"
        - "macOS 27"
        - "Other (specify in description)"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Apple Silicon model + RAM. From **Apple Menu → About This Mac**.
      placeholder: "e.g., MacBook Pro M4 Max, 64GB"
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Anti-cheat
      description: Some anti-cheat systems are fundamentally incompatible with Wine on macOS.
      options:
        - label: This game uses an anti-cheat system (EasyAntiCheat, BattlEye, Vanguard, Denuvo, etc.) that I'm aware of.
          required: false
  - type: checkboxes
    attributes:
      label: Pre-flight checks
      options:
        - label: I checked the in-app Game Configurations browser for an existing config.
          required: true
        - label: I'm running **this fork** (`frankea/Whisky`, confirmed via **Whisky → About Whisky**, version 3.0 or later), not the archived original that the default `brew install --cask whisky` installs.
          required: true
        - label: I searched existing issues for this game.
          required: true
        - label: My issue is written in English.
          required: true
